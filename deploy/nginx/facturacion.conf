# HTTP — instalación inicial o antes de tener certificado SSL.
# Reemplazar __DOMAIN__ por tu dominio o IP.

upstream facturacion_gunicorn {
    server 127.0.0.1:__GUNICORN_PORT__;
}

server {
    listen 80;
    server_name __DOMAIN__;

    include /var/www/facturacion/deploy/nginx/facturacion-security-headers.conf;
    include /var/www/facturacion/deploy/nginx/facturacion-app-locations.conf;
}

server {
    listen 80;
    server_name www.__DOMAIN__;

    return 301 http://__DOMAIN__$request_uri;
}
