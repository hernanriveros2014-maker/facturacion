version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: facturacion_db_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=facturacion1
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=tu_password
    ports:
      - "5432:5432"

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: facturacion_web_dev
    command: >
      sh -c "until nc -z db 5432; do echo 'Esperando a la base de datos...'; sleep 1; done &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume_dev:/app/static
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:1.25-alpine
    container_name: facturacion_nginx_dev
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume_dev:/app/static:ro
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data_dev:
  static_volume_dev:
